<!-- =====================================================================
     NINU — PDP Trust Bar / Social-Proof Section (snippet only)
     Paste into a Shopify theme section, right below the Add-to-Cart
     button on the product page (e.g. in main-product.liquid, directly
     after the {% render 'buy-buttons' %} include, or as its own
     Custom Liquid / HTML block positioned under the ATC button).

     Scoped entirely under .ninu-tb so it won't leak into theme styles.
     Uses the same brand tokens as pdp/ninu-pdp.html and
     pdp/ninu-advertorial.html (terracotta / espresso / warm gold /
     sage — NOT the blue/purple of the competitor reference screenshots
     this was modeled on).

     ----------------------------------------------------------------
     BEFORE GOING LIVE — things you must confirm or fill in:

     1. Customer avatar photos — the three circles in the "Trusted by"
        row currently hold AI-generated placeholder photos (base64
        embedded directly, each marked with an HTML comment reading
        "AI-generated placeholder, not a real customer photo").
        Replace each .ninu-tb-avatar span's <img src> with a real,
        consenting customer's photo once you have one — real photos
        are still preferred over generated ones.

     2. Ship-date / delivery-estimate variables — three numbers near
        the top of the <script> block below
        (SHIPS_WITHIN_BUSINESS_DAYS, DELIVERY_MIN_BUSINESS_DAYS,
        DELIVERY_MAX_BUSINESS_DAYS). Defaults assume next-business-day
        shipping and a 5-7 business day delivery window, matching the
        free US shipping offer already used across this account's ad
        and PDP copy. Edit these three numbers only if your real
        fulfillment timing differs — nothing else in the script needs
        to change.

     3. Review count is set to 10,000+ per owner confirmation
        (2026-10-26). Update the text in the "Trusted by" line below
        if this changes.

     4. Icon row: Secure Checkout, Natural Ingredients, Made in the
        USA, Free US Shipping — Natural Ingredients and Made in the
        USA added per owner confirmation (2026-10-26), these were not
        previously established elsewhere in this account's copy.

     5. Payment badges are now rendered in each brand's real primary
        color (Visa blue, Mastercard red/orange, Amex blue, PayPal
        blue, Apple Pay black, Google Pay blue) rather than monochrome
        ink, to match the reference layout. Mastercard and Google Pay
        are simplified geometric reconstructions (two overlapping
        circles; a blue "G" + grey "Pay" wordmark) rather than the
        exact official lockups, since no single verified-license source
        had all 6 brands in accurate full color — reasonable for a
        trust-badge row, but swap in official assets from each brand's
        press/developer page before high-stakes use.
     ===================================================================== -->
<style>
.ninu-tb{--bg:#F5EFE6;--card:#FBF7F0;--ink:#241812;--muted:#7A6A5C;--line:#E4D9CB;--acc:#B85A3E;--acc-2:#8E3F27;--gold:#C79A5A;--sage:#5C7A55;--white:#fff;font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:var(--ink);box-sizing:border-box;max-width:480px;margin:18px auto 0}
.ninu-tb *,.ninu-tb *::before,.ninu-tb *::after{box-sizing:border-box}

/* 1. Ships-by line */
.ninu-tb-ship{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:3px;text-align:center}
.ninu-tb-dot{width:8px;height:8px;border-radius:999px;background:var(--sage);flex-shrink:0;position:relative}
.ninu-tb-dot::after{content:'';position:absolute;inset:-3px;border-radius:999px;background:var(--sage);opacity:.35}
.ninu-tb-delivery{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px}

/* 2. Guarantee card */
.ninu-tb-guarantee{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.ninu-tb-guarantee-icon{flex-shrink:0;width:38px;height:38px;border-radius:999px;background:#EEF3EA;color:var(--sage);display:flex;align-items:center;justify-content:center}
.ninu-tb-guarantee-icon svg{width:21px;height:21px;display:block}
.ninu-tb-guarantee-t{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:2px}
.ninu-tb-guarantee-d{font-size:12.5px;color:var(--muted);line-height:1.4}

/* 3. Icon row */
.ninu-tb-icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 8px;margin-bottom:14px}
.ninu-tb-icon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:0 2px}
.ninu-tb-icon-circle{width:34px;height:34px;border-radius:999px;background:var(--white);border:1px solid var(--line);color:var(--acc-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ninu-tb-icon-circle svg{width:17px;height:17px;display:block}
.ninu-tb-icon span{font-size:10.5px;line-height:1.25;font-weight:600;color:var(--ink);letter-spacing:.01em}

/* 4. Payment badges row */
.ninu-tb-payments{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.ninu-tb-pay{width:42px;height:28px;border-radius:6px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ninu-tb-pay svg{width:22px;height:22px;display:block}
.ninu-tb-pay-wide{width:52px}
.ninu-tb-pay-wide svg{width:40px;height:21px}
.ninu-tb-pay.ninu-tb-pay-text{font-size:8.5px;font-weight:800;letter-spacing:.02em;color:var(--muted)}

/* 5. Trusted-by avatars */
.ninu-tb-trusted{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ninu-tb-avatars{display:flex;flex-shrink:0}
.ninu-tb-avatar{width:34px;height:34px;border-radius:999px;background:#D9CFC2;border:2px solid var(--card);margin-left:-10px;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}
.ninu-tb-avatar:first-child{margin-left:0}
.ninu-tb-avatar svg{width:16px;height:16px;opacity:.6}
.ninu-tb-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.ninu-tb-trusted-t{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:2px}
.ninu-tb-trusted-d{font-size:12px;color:var(--muted);line-height:1.4}

@media (max-width:360px){
  .ninu-tb-icons{padding:14px 4px}
  .ninu-tb-icon span{font-size:9.5px}
}
</style>

<script>
(function(){
  // ======= EDIT THESE THREE NUMBERS TO MATCH REAL FULFILLMENT =========
  // Ninu ships free US shipping on every order (established offer).
  // SHIPS_WITHIN_BUSINESS_DAYS: how many business days from "today"
  //   until the order ships. Default assumes next-business-day shipping.
  var SHIPS_WITHIN_BUSINESS_DAYS = 1;
  // DELIVERY_MIN/MAX_BUSINESS_DAYS: the transit window AFTER it ships.
  //   Default is the standard 5-7 business day free-shipping estimate.
  var DELIVERY_MIN_BUSINESS_DAYS = 5;
  var DELIVERY_MAX_BUSINESS_DAYS = 7;
  // ======================================================================

  function addBusinessDays(date, days){
    var result = new Date(date.getTime());
    var added = 0;
    while (added < days) {
      result.setDate(result.getDate() + 1);
      var day = result.getDay(); // 0 = Sun, 6 = Sat
      if (day !== 0 && day !== 6) added++;
    }
    return result;
  }

  function formatDate(date){
    return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  var today = new Date();
  var shipDate = addBusinessDays(today, SHIPS_WITHIN_BUSINESS_DAYS);
  var deliveryStart = addBusinessDays(shipDate, DELIVERY_MIN_BUSINESS_DAYS);
  var deliveryEnd = addBusinessDays(shipDate, DELIVERY_MAX_BUSINESS_DAYS);

  var shipEl = document.getElementById('ninu-tb-ship-date');
  if (shipEl) shipEl.textContent = formatDate(shipDate);

  var delEl = document.getElementById('ninu-tb-delivery');
  if (delEl) {
    delEl.textContent = 'Estimated delivery ' + formatDate(deliveryStart) + ' to ' +
      formatDate(deliveryEnd) + ' (' + DELIVERY_MIN_BUSINESS_DAYS + '-' +
      DELIVERY_MAX_BUSINESS_DAYS + ' business days)';
  }
})();
</script>
